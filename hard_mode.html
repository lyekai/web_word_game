<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>困難模式：單字解謎</title>
    <link rel="stylesheet" href="static/css/hard_mode.css">
</head>
<body>
    <audio id="easy-bgm" src="static/audio/music_hard.mp3" loop autoplay></audio>

    <div class="bg-layer"></div>
    <a href="index.html" alt="go-back">
        <button id="back-btn" class="back-btn">回上頁</button>
    </a>

    <div id="level-indicator">
        <div class="level-circle active">1</div>
        <div class="level-circle">2</div>
        <div class="level-circle">3</div>
        <div class="level-circle">4</div>
        <div class="level-circle">5</div>
        <div class="level-circle">6</div>
        <div class="level-circle">7</div>
        <div class="level-circle">8</div>
        <div class="level-circle">9</div>
        <div class="level-circle">10</div>
        <div class="level-circle">11</div>
        <div class="level-circle">12</div>
    </div>

    <div id="stars-container">
        <span class="star word-star">★</span>
        <span class="star word-star">★</span>
        <span class="star word-star">★</span>
        <span class="star sentence-star">★</span>
        <span class="star sentence-star">★</span>
        <span class="star sentence-star">★</span>
        <span class="star sentence-star">★</span>

        <div id="scoring-standards" class="scoring-standards">
            <h4>如何獲得更多星星?</h4>
            <ul>
                <li>⭐ 句子符合題目文法提示要求</li>
                <li>⭐ 句子完全使用了所選擇的三個單字</li>
                <li>⭐ 基本文法、大小寫、標點與空格使用正確</li>
                <li>⭐ 句子使用適當形容詞，達一定長度、豐富度</li>
            </ul>
        </div>
    </div>

    <div id="game-box" class="game-box">
        <div id="left-side">
            <img id="vague-image" src="" alt="vague-image">
            <p>猜猜看圖片中有什麼？</p>
        </div>
        <div id="right-side">
            <div id="tip-boxes">
                <div class="tip-box" id="tip1"></div>
                <div class="tip-box" id="tip2"></div>
                <div class="tip-box" id="tip3"></div>
            </div>
            <div id="answer-boxes">
                <div class="answer-box" id="answer1"></div>
                <div class="answer-box" id="answer2"></div>
                <div class="answer-box" id="answer3"></div>
            </div>
        </div>
    </div>

    <div class="sentence" id="sentence">
        <p>請用選擇的三個單字造一個句子</p>
        <input type="text" id="sentence-input" placeholder="在這裡輸入您的英文句子..." class="sentence-input">
        <button class="confirm-btn hidden">確認</button>
    </div>

    <div id="answer-area" class="answer-area">
        <div class="word-card">
            <div class="cards"></div>
            <button class="submit-btn hidden">檢查答案</button>
        </div> 
        <div class="feed-back">
            <div id="feedback-container"></div>
        </div> 
    </div>

    <div id="image-modal" class="modal-backdrop">
        <div class="modal-content">
            <div id="modal-summary-stars" class="modal-summary-stars">
                <span class="m-star">★</span>
                <span class="m-star">★</span>
                <span class="m-star">★</span>
                <span class="m-star">★</span>
                <span class="m-star">★</span>
                <span class="m-star">★</span>
                <span class="m-star">★</span>
            </div>
            <div class="modal-body">
                <div class="modal-body-flex">
                    <div class="image-column">
                        <h3>關卡原始圖片：</h3>
                        <img id="generated-image" src="" alt="Original Image">
                    </div>
                    <div class="image-column">
                        <h3>您用句子生成的圖片如下：</h3>
                        <div id="ai-loading-placeholder">圖片生成中...</div>
                        <img id="ai-generated-image" src="" alt="AI Generated Image" class="hidden">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="next-level-btn">下一關</button>
            </div>
        </div>
    </div>

    <button id="fullscreen-btn" onclick="toggleFullScreen()" style="position: fixed; top: 20px; left: 110px; padding: 10px 15px; background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 8px; color: white; font-size: 1.1em; cursor: pointer; z-index: 10;">🔍 全螢幕</button>


    <script>
        let currentLevel = 1; 
        let levelDataCache = []; 
        let currentSentencePrompt = ""; 
        let feedbackCount = 0; 

        const words = [
            "pizza","kite","grassland","computer","coffee","office","television","sofa","living room",
            "clock","blackboard","classroom","sandwich","robot","factory","bottle","badminton","gym","basketball",
            "scarf","park","glasses","madam","boutique","bathtub","toilet","bathroom","campsite","tent","guitar","magnifier",
            "pasta","scientist","hero","reporter","street","hamburger","market","earphone","wallet","donut","swimsuit"
        ];

        function updateStars(type, count) {
            const selector = type === 'word' ? '.word-star' : '.sentence-star';
            const starGroup = document.querySelectorAll(selector);
            starGroup.forEach((star, index) => {
                if (index < count) {
                    star.classList.add('active'); 
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function typeEffect(elementId, text, delay = 30, callback = null) {
            const container = document.getElementById(elementId);
            container.innerHTML = ''; 
            
            const outputElement = document.createElement('div');
            outputElement.style.whiteSpace = 'pre-wrap'; 
            outputElement.style.lineHeight = '1.6'; 
            container.appendChild(outputElement);
            
            let i = 0;
            const feedBackBox = document.querySelector(".feed-back"); 
            
            function typing() {
                if (i < text.length) {
                    outputElement.textContent += text.charAt(i);
                    i++;
                    if (feedBackBox) feedBackBox.scrollTop = feedBackBox.scrollHeight;
                    setTimeout(typing, delay);
                } else if (callback) { 
                    callback(); 
                }
            }
            typing();
        }

        // 前端 AI 繪圖產生器 (經由 Vercel 後端安全帶入付費版 Key)
        async function generateFrontendImage(promptText) {
            const response = await fetch("/api/generate-image", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ promptText })
            });

            if (!response.ok) {
                let errorMessage = `圖片生成失敗（HTTP ${response.status}）`;
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.details || errorData.error || errorMessage;
                    console.error("Pollinations 生圖 API 錯誤：", errorData);
                } catch (_) {
                    // 回應不是 JSON 時保留 HTTP 錯誤訊息。
                }
                throw new Error(errorMessage);
            }

            const contentType = response.headers.get("content-type") || "";
            if (!contentType.toLowerCase().startsWith("image/")) {
                throw new Error(`後端回應不是圖片（${contentType || "未知 Content-Type"}）`);
            }

            const imageBlob = await response.blob();
            if (!imageBlob.size) {
                throw new Error("API 回傳的圖片內容是空的");
            }

            // objectUrl 用於當前畫面顯示；portfolioImage 用於作品集儲存。
            const objectUrl = URL.createObjectURL(imageBlob);
            let portfolioImage = objectUrl;

            try {
                // 壓縮成 512x512 JPEG data URL，避免把暫時性 blob URL 存進 localStorage。
                // 若轉檔失敗，仍可顯示圖片，但作品集會暫存 object URL。
                portfolioImage = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => {
                        try {
                            const canvas = document.createElement("canvas");
                            canvas.width = 512;
                            canvas.height = 512;
                            const context = canvas.getContext("2d");
                            context.fillStyle = "#ffffff";
                            context.fillRect(0, 0, canvas.width, canvas.height);

                            const scale = Math.min(512 / image.naturalWidth, 512 / image.naturalHeight);
                            const width = Math.round(image.naturalWidth * scale);
                            const height = Math.round(image.naturalHeight * scale);
                            const x = Math.round((512 - width) / 2);
                            const y = Math.round((512 - height) / 2);
                            context.drawImage(image, x, y, width, height);
                            resolve(canvas.toDataURL("image/jpeg", 0.78));
                        } catch (error) {
                            reject(error);
                        }
                    };
                    image.onerror = () => reject(new Error("無法讀取生成的圖片"));
                    image.src = objectUrl;
                });
            } catch (error) {
                console.warn("作品集圖片壓縮失敗，暫用當前圖片網址：", error);
            }

            return { objectUrl, portfolioImage };
        }

        // Gemini API 前端呼叫邏輯
        async function fetchGeminiAnalysis(userSentence, correctSelected, wrongSelected, missingWords, targetAnswers, sentencePrompt, roundIndex) {
            const requestBody = {
                userSentence,
                correctSelected,
                wrongSelected,
                missingWords,
                targetAnswers,
                sentencePrompt,
                roundIndex
            };

            // 呼叫 Vercel Serverless Function 路由
            const response = await fetch("/api/gemini", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`Serverless API 回應異常: ${response.status}`);
            }

            const data = await response.json();
            return data.result;
        }

        // API 請求失敗時觸發的本地罐頭診斷引擎 (Fallback)
        function generatePureFrontendFeedback(sentence, missingWords, userWords) {
            let feedback = "🤖 AI 老師學習與診斷建議：\n\n";
            const s = sentence.trim();

            if (missingWords.length > 0) {
                feedback += `1. 單字提示：有部分目標單字尚未答對或填入哦！請再次檢查圖片細節。\n`;
            } else {
                feedback += `1. 單字提示：太棒了！三個圖片目標單字都有正確選擇與應用！\n`;
            }

            let grammarIssues = [];
            if (!/^[A-Z]/.test(s)) grammarIssues.push("句首字母記得要大寫");
            if (!/[.!?]$/.test(s)) grammarIssues.push("句尾記得加上標點符號 (.)");
            
            if (grammarIssues.length > 0) {
                feedback += `2. 文法修正：${grammarIssues.join("；")}。\n`;
            } else {
                feedback += `2. 文法修正：大小寫與句尾標點符號非常標準！\n`;
            }

            const wordCount = s.split(/\s+/).filter(w => w.length > 0).length;
            if (wordCount < 6) {
                feedback += `3. 畫面引導建議：試著加入一些形容詞（如 big, cute, happy）來豐富句子內容，讓畫面更生動！\n`;
            } else {
                feedback += `3. 畫面引導建議：句子非常有豐富度，表現非常優異！\n`;
            }

            return feedback;
        }

        async function showModal() {
            const levelData = levelDataCache.find(item => Number(item.level) === Number(currentLevel));
            const userSentence = document.getElementById("sentence-input").value.trim();
            
            const currentWordStars = document.querySelectorAll('.word-star.active').length;
            const currentSentenceStars = document.querySelectorAll('.sentence-star.active').length;

            const originalImg = document.getElementById("generated-image");
            const aiImg = document.getElementById("ai-generated-image");
            const loading = document.getElementById("ai-loading-placeholder");
            const footer = document.querySelector(".modal-footer"); 

            if (levelData) originalImg.src = levelData.image_origin;
            loading.classList.remove("hidden");
            loading.textContent = "AI 繪圖大師正在根據你的造句繪製插畫..."; 
            aiImg.classList.add("hidden");
            footer.style.display = "none"; 

            document.getElementById("image-modal").classList.add("visible");
            playStarAnimation(currentWordStars, currentSentenceStars);

            handleFinalSave();

            try {
                const generatedImage = await generateFrontendImage(userSentence);
                aiImg.src = generatedImage.objectUrl;
                loading.classList.add("hidden");
                aiImg.classList.remove("hidden");
                footer.style.display = "flex";

                saveToPortfolio({
                    image: generatedImage.portfolioImage,
                    mode: '困難模式',
                    level: currentLevel,
                    sentence: userSentence,
                    wordStars: currentWordStars,
                    sentenceStars: currentSentenceStars,
                    time: new Date().toLocaleString('zh-TW', { hour12: false })
                });
            } catch (e) {
                console.error("AI 生圖失敗：", e);
                loading.textContent = `圖片生成失敗：${e.message || "請稍後再試"}。過關紀錄不受影響。`;
                aiImg.classList.add("hidden");
                footer.style.display = "flex";
            }
        }

        function loadLevel(level, isReplay = false) {
            const targetLevel = Number(level);
            const levelData = levelDataCache.find(item => Number(item.level) === targetLevel);
            
            if (!levelData) {
                console.error("loadLevel 找不到資料:", targetLevel);
                return;
            }
            
            currentLevel = targetLevel;
            feedbackCount = 0; 
            
            document.querySelectorAll(".level-circle").forEach(c => {
                c.classList.remove("active");
                if (Number(c.textContent) === targetLevel) c.classList.add("active");
            });

            const vagueImg = document.getElementById("vague-image");
            const originalImg = document.getElementById("generated-image");

            vagueImg.src = levelData.image_vague;
            originalImg.src = levelData.image_origin; 

            document.getElementById("tip1").textContent = levelData.tip[0];
            document.getElementById("tip2").textContent = levelData.tip[1];
            document.getElementById("tip3").textContent = levelData.tip[2];

            if (!isReplay) {
                document.querySelectorAll(".answer-box").forEach(b => { 
                    b.textContent = ""; 
                    b.classList.remove("incorrect", "correct", "correct-locked"); 
                });
                document.getElementById("sentence-input").value = "";
                document.getElementById("feedback-container").innerHTML = "";

                const confirmBtn = document.querySelector(".confirm-btn");
                if (confirmBtn) {
                    confirmBtn.textContent = "確認";
                    confirmBtn.disabled = false;
                }

                renderCards(); 
                setSentencePrompt(levelData);
            }
            updateConfirmButton();
            document.querySelectorAll(".star").forEach(s => {
                s.classList.remove("active", "lit");
            });
            document.querySelectorAll(".m-star").forEach(s => {
                s.classList.remove("active-word", "active-sentence", "lit");
            });
        }

        function renderCards() {
            const container = document.querySelector(".cards");
            const taken = Array.from(document.querySelectorAll(".answer-box")).map(b => b.textContent.trim()).filter(w => w !== "");
            container.innerHTML = "";
            [...words].sort().forEach(word => {
                if (taken.includes(word)) return;
                const card = document.createElement("div");
                card.className = "card";
                card.textContent = word;
                card.dataset.word = word;
                container.appendChild(card);
            });
        }

        function setSentencePrompt(levelData) {
            const p = document.querySelector("#sentence p");
            if (levelData?.sentence?.length > 0) {
                currentSentencePrompt = levelData.sentence[Math.floor(Math.random() * levelData.sentence.length)];
                p.innerHTML = `請用選擇的三個單字造一個句子 (${currentSentencePrompt})`;
            }
        }

        function updateConfirmButton() {
            const a1 = document.getElementById("answer1").textContent.trim();
            const a2 = document.getElementById("answer2").textContent.trim();
            const a3 = document.getElementById("answer3").textContent.trim();
            const s = document.getElementById("sentence-input").value.trim();
            
            const isCardsFull = (a1 !== "" && a2 !== "" && a3 !== "");
            document.querySelector(".submit-btn").classList.toggle("hidden", !isCardsFull);

            const isSentenceReady = (s !== "");
            document.querySelector(".confirm-btn").classList.toggle("hidden", !isSentenceReady);
        }

        function handleSubmitAnswer() {
            const levelData = levelDataCache.find(item => item.level === currentLevel);
            if (!levelData) return;
            const userBoxes = [document.getElementById("answer1"), document.getElementById("answer2"), document.getElementById("answer3")];
            const corrects = levelData.answer.map(w => w.toLowerCase());

            userBoxes.forEach(box => {
                const word = box.textContent.trim().toLowerCase();
                box.classList.remove("incorrect", "correct", "correct-locked");
                if (corrects.includes(word)) {
                    box.classList.add("correct", "correct-locked"); 
                } else if (word !== "") {
                    box.classList.add("incorrect"); 
                }
            });
            const correctCount = document.querySelectorAll(".answer-box.correct").length;
            updateStars('word', correctCount);
        }

        function evaluateSentenceStars(sentence, userWords) {
            let stars = 0;
            const s = sentence.trim();
            const sLower = s.toLowerCase();
            
            const hasPattern = /\b(these|those|they are)\b/i.test(sLower) || /\bwhat (is|are) .+ doing\b/i.test(sLower);
            const usedCount = userWords.filter(w => sLower.includes(w.toLowerCase())).length;
            
            const hasSubject = /\b(i|you|he|she|it|we|they|the|this|that|these|those)\b/i.test(sLower);
            const hasVerb = /\b(is|am|are|was|were|be|have|has|do|does|did|can|could|will|should)\b/i.test(sLower);
            const properFormat = /^[A-Z]/.test(s) && /[.!?]$/.test(s); 
            const noSpacingIssue = !(/\s[.,!?;:]|[.,!?;:](?!\s|$)|\s{2,}/.test(s)); 
            
            const wordCount = s.split(/\s+/).filter(w => w.length > 0).length;
            const hasAdjective = /\b(round|square|beautiful|handsome|fragrant|delicious|colorful|expensive|cheap|smart|cute|big|huge|wide|narrow|tall|short|small|happy|sad|hot|cold|red|orange|blue|green|yellow|white|black|gray|fast|slow|good|nice|comfortable|dark|bright)\b/i.test(sLower);

            if (hasPattern) {
                stars = 1;
                if (usedCount >= 3) {
                    stars = 2;
                    if (properFormat && hasSubject && hasVerb && noSpacingIssue) {
                        stars = 3;
                        if (wordCount >= 20 && hasAdjective) {
                            stars = 4;
                        }
                    }
                }
            }

            updateStars('sentence', stars);
        }

        async function handleConfirm() {
            const btn = document.querySelector(".confirm-btn");
            const sentenceInput = document.getElementById("sentence-input");
            const levelData = levelDataCache.find(item => Number(item.level) === Number(currentLevel));
            
            if (!levelData) return;

            const userBoxes = [document.getElementById("answer1"), document.getElementById("answer2"), document.getElementById("answer3")];
            const selectedWords = userBoxes.map(b => b.textContent.trim().toLowerCase()).filter(w => w !== "");
            const targetAnswers = levelData.answer.map(w => w.toLowerCase());

            const correctSelected = selectedWords.filter(w => targetAnswers.includes(w));
            const wrongSelected = selectedWords.filter(w => !targetAnswers.includes(w));
            const missingWords = targetAnswers.filter(w => !selectedWords.includes(w));

            evaluateSentenceStars(sentenceInput.value.trim(), selectedWords);

            if (feedbackCount >= 2) { 
                showModal();
                return;
            }

            btn.disabled = true;
            document.getElementById("feedback-container").innerHTML = "🤖 AI 老師正在連線批改並分析學習進度...";

            let finalFeedback = "";
            try {
                finalFeedback = await fetchGeminiAnalysis(
                    sentenceInput.value.trim(),
                    correctSelected,
                    wrongSelected,
                    missingWords,
                    targetAnswers,
                    currentSentencePrompt,
                    feedbackCount
                );
            } catch (err) {
                console.warn("Gemini API 請求失敗，改為本地診斷引導:", err);
                finalFeedback = generatePureFrontendFeedback(sentenceInput.value.trim(), missingWords, selectedWords);
            }

            typeEffect('feedback-container', finalFeedback, 30, () => {
                feedbackCount++; 
                btn.disabled = false;

                if (feedbackCount < 2) {
                    btn.textContent = "再造一次";
                } else {
                    btn.textContent = "生成圖片";
                }
                updateConfirmButton();
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".cards").addEventListener("click", e => {
                if (!e.target.classList.contains("card")) return;
                const emptyBox = [
                    document.getElementById("answer1"),
                    document.getElementById("answer2"),
                    document.getElementById("answer3")
                ].find(b => b.textContent.trim() === "");
                
                if (emptyBox) {
                    emptyBox.textContent = e.target.dataset.word; 
                    e.target.remove(); 
                    updateConfirmButton(); 
                }
            });

            document.querySelectorAll(".answer-box").forEach(box => {
                box.addEventListener("click", () => {
                    if (box.textContent === "" || box.classList.contains("correct-locked")) return;
                    box.textContent = ""; 
                    box.classList.remove("incorrect", "correct");
                    renderCards(); 
                    updateConfirmButton();
                });
            });

            document.getElementById("sentence-input").addEventListener("input", () => {
                updateConfirmButton();
            });

            document.querySelector(".confirm-btn").addEventListener("click", handleConfirm);
            document.querySelector(".submit-btn").addEventListener("click", handleSubmitAnswer); 

            document.getElementById("next-level-btn").addEventListener("click", () => { 
                document.getElementById("image-modal").classList.remove("visible");
                handleFinalSave(); 

                document.querySelectorAll(".m-star").forEach(s => {
                    s.classList.remove("active-word", "active-sentence");
                });
                        
                setTimeout(() => {
                    loadLevel(currentLevel + 1); 
                }, 100);
            });
            
            fetch("static/data/hard_mode.json")
                .then(res => {
                    if (!res.ok) throw new Error("找不到困難模式關卡檔案");
                    return res.json();
                })
                .then(data => { 
                    levelDataCache = data; 
                    const urlParams = new URLSearchParams(window.location.search);
                    const levelParam = urlParams.get('level');
                    loadLevel(levelParam ? parseInt(levelParam) : 1);
                })
                .catch(err => {
                    console.error(err);
                    alert("讀取關卡失敗，請檢查 static/data/hard_mode.json 是否存在");
                });
        });

        function saveToPortfolio(data) {
            try {
                let portfolio = JSON.parse(localStorage.getItem('userPortfolio')) || [];
                portfolio.unshift(data); 

                if (portfolio.length > 50) {
                    portfolio.pop(); 
                }

                localStorage.setItem('userPortfolio', JSON.stringify(portfolio));
            } catch (e) {
                console.error("儲存失敗，可能是 localStorage 空間不足:", e);
                alert("作品集儲存空間已滿，請到個人作品集刪除一些舊作品哦！");
            }
        }

        function playStarAnimation(totalWordStars, totalSentenceStars) {
            const modalStars = document.querySelectorAll('.m-star');
            const starAudioPath = 'static/audio/star.mp3';
            
            modalStars.forEach(s => s.classList.remove('active-word', 'active-sentence'));

            for (let i = 0; i < totalWordStars; i++) {
                setTimeout(() => {
                    if (modalStars[i]) {
                        modalStars[i].classList.add('active-word');
                        new Audio(starAudioPath).play().catch(e => {}); 
                    }
                }, i * 400);
            }

            for (let j = 0; j < totalSentenceStars; j++) {
                setTimeout(() => {
                    const starIndex = j + 3; 
                    if (modalStars[starIndex]) {
                        modalStars[starIndex].classList.add('active-sentence');
                        new Audio(starAudioPath).play().catch(e => {}); 
                    }
                }, (j + totalWordStars) * 400); 
            }
        }

        function handleFinalSave() {
            const mode = 'hard';
            const currentWordStars = document.querySelectorAll('.word-star.active').length;
            const currentSentenceStars = document.querySelectorAll('.sentence-star.active').length;
            const totalStars = currentWordStars + currentSentenceStars;

            let starRecords = JSON.parse(localStorage.getItem('starRecords')) || { "easy": {}, "hard": {} };
            if (!starRecords[mode]) starRecords[mode] = {};
            const prevStars = starRecords[mode][currentLevel] || 0;
            if (totalStars > prevStars) {
                starRecords[mode][currentLevel] = totalStars;
                localStorage.setItem('starRecords', JSON.stringify(starRecords));
            }

            let progressData = JSON.parse(localStorage.getItem('gameProgress')) || { "easy": 1, "hard": 1 };
            if (currentLevel >= progressData[mode]) {
                progressData[mode] = currentLevel + 1;
                localStorage.setItem('gameProgress', JSON.stringify(progressData));
            }
        }
        // 當手機鍵盤打開時，透過 JavaScript 滾動與鎖定高度，避免佈局被壓縮
        window.addEventListener("DOMContentLoaded", () => {
            const inputField = document.getElementById("sentence-input");
            if (inputField) {
                inputField.addEventListener("focus", () => {
                    // 輸入時自動將畫面平滑拉至輸入區域，避免被虛擬鍵盤推擠變形
                    setTimeout(() => {
                        inputField.scrollIntoView({ behavior: "smooth", block: "center" });
                    }, 300);
                });
            }
        });

        // 切換全螢幕函式
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                // 進入全螢幕並嘗試鎖定為橫屏 (支援的行動裝置會自動轉橫並隱藏網址列)
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(err => {
                            console.log("螢幕鎖定橫向失敗或不支援: ", err);
                        });
                    }
                }).catch(err => {
                    console.error(`無法啟用全螢幕模式: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 選擇性：當使用者第一次點擊畫面時，自動幫他進入全螢幕（增加遊戲體驗）
        window.addEventListener('click', function initFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    // 瀏覽器通常要求必須由使用者互動（點擊）觸發，這裡捕捉例外避免報錯
                });
            }
        }, { once: true }); // 只觸發一次
    </script>
</body>
</html>
